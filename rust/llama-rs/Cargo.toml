[package]
name = "llama-rs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]
test = false
doctest = false

[features]
llguidance = ["llama-sampling/llguidance"]

[dependencies]
llama-args = { path = "../llama-args" }
llama-http = { path = "../llama-http" }
llama-download = { path = "../llama-download" }
llama-schema = { path = "../llama-schema" }
llama-quantize = { path = "../llama-quantize" }
llama-sampling = { path = "../llama-sampling" }
